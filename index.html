<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087d57"><meta name="description" content="Porfa: favores cerca de ti. Demostración local."><title>Porfa 1.0 — Demo interactiva</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#15362b;background:#edf3ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:580px;margin:auto;background:#fff;min-height:100dvh;padding:18px 18px 100px}.head{display:flex;align-items:center;justify-content:space-between}.brand{font-size:35px;font-weight:850;letter-spacing:-1.5px;color:#087d57}.tag{background:#e4f4eb;color:#086b4a;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.muted{color:#61756a}.small{font-size:13px}.hero{padding:18px;border-radius:20px;background:linear-gradient(125deg,#e2f5e9,#f3faf5);margin:18px 0}.hero h2{margin:0 0 7px;font-size:23px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #dfe9e2;border-radius:17px;padding:15px;margin:12px 0;background:white}.card h3{margin:0 0 6px}.pill{display:inline-block;background:#eff4f1;border-radius:30px;padding:5px 9px;font-size:12px;color:#446657}.price{font-size:23px;color:#087d57;font-weight:800}.btn{border:0;border-radius:12px;padding:12px 14px;background:#087d57;color:white;font-weight:750;min-height:45px}.btn.secondary{background:#e7f2eb;color:#076d4c}.btn.outline{background:white;color:#087d57;border:1px solid #b8d5c5}.btn.full{width:100%}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cdded3;border-radius:11px;padding:12px;background:white;color:#18362c}textarea{min-height:86px;resize:vertical}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:580px;width:100%;display:flex;background:white;border-top:1px solid #dce8df;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}nav button{flex:1;border:0;background:white;color:#6b7d72;font-size:12px;padding:8px 1px}nav button.active{color:#087d57;font-weight:800}.notice{background:#fff8e9;border:1px solid #f2dca7;border-radius:12px;padding:11px;font-size:13px}.ok{background:#e7f7ec;border-radius:12px;padding:11px;color:#11683e;font-size:13px}.hide{display:none!important}.section-title{font-size:21px;margin:20px 0 10px}.progress{height:8px;border-radius:12px;background:#e4ebe5;overflow:hidden}.progress span{display:block;height:100%;background:#0b9568}.empty{text-align:center;padding:32px 12px;color:#6d7e73} .switch{display:flex;gap:8px;margin:12px 0}.switch button{flex:1}.worker{padding:12px;background:#f5f9f6;border-radius:12px;margin:8px 0} .badge{font-size:12px;color:#076c4a;font-weight:700}footer{font-size:12px;color:#718478;margin:25px 0 0} @media(min-width:650px){.app{box-shadow:0 4px 40px #1c3e2920}}
</style></head><body><div class="app"><header class="head"><div class="brand">Porfa<span style="color:#ffad49">.</span></div><span class="tag">1.0 · DEMO</span></header><p class="muted small" style="margin-top:4px">Alguien cerca puede ayudarte.</p><div id="view"></div><footer>Demostración local: sin usuarios, verificaciones ni pagos reales. No publiques datos sensibles.</footer></div><nav id="nav"><button data-page="home">⌂<br>Inicio</button><button data-page="create">＋<br>Publicar</button><button data-page="jobs">▤<br>Mis tareas</button><button data-page="profile">♙<br>Perfil</button></nav><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seeds=[{id:'d1',title:'Recoger un paquete',description:'Recoger paquete pequeño y entregarlo en un lugar acordado.',price:20,country:'US',city:'Nashville',mode:'now',category:'Entregas',status:'available',demo:true},{id:'d2',title:'Armar una mesa',description:'Ayuda para armar un mueble sencillo.',price:35,country:'US',city:'La Vergne',mode:'scheduled',category:'Hogar',status:'available',demo:true},{id:'d3',title:'Hacer compras',description:'Recoger una compra pequeña en el supermercado.',price:15,country:'VE',city:'Carora',mode:'now',category:'Compras',status:'available',demo:true},{id:'d4',title:'Pasear un perro',description:'Paseo corto por el vecindario.',price:12,country:'VE',city:'Barquisimeto',mode:'scheduled',category:'Mascotas',status:'available',demo:true}];
let data;try{data=JSON.parse(localStorage.getItem('porfa-demo-v1'))}catch(e){};if(!data||!Array.isArray(data.jobs))data={country:'US',jobs:[],name:'Invitado'};let page='home',filter='all',activeId=null;
function save(){try{localStorage.setItem('porfa-demo-v1',JSON.stringify(data))}catch(e){}}function all(){return [...data.jobs,...seeds]}function task(id){return all().find(t=>t.id===id)}function setPage(p){page=p;activeId=null;render()}function countrySwitch(){return `<div class="switch"><button class="btn ${data.country==='US'?'':'secondary'}" data-country="US">🇺🇸 Estados Unidos</button><button class="btn ${data.country==='VE'?'':'secondary'}" data-country="VE">🇻🇪 Venezuela</button></div>`}function taskCard(t){return `<div class="card"><div class="row between"><span class="pill">${esc(t.category)} · ${t.mode==='now'?'⚡ Ahora':'▦ Programado'}</span><span class="price">$${Number(t.price).toFixed(2)}</span></div><h3 style="margin-top:10px">${esc(t.title)}</h3><div class="muted small">📍 ${esc(t.city)} · ${t.country==='US'?'EE. UU.':'Venezuela'}</div><p class="small">${esc(t.description)}</p><div class="row between"><span class="badge">${statusLabel(t.status)}</span><button class="btn secondary" data-open="${esc(t.id)}">Ver detalles →</button></div></div>`}function statusLabel(s){return ({available:'Disponible',offered:'Oferta enviada (simulada)',assigned:'Asignada (simulada)',completed:'Completada (simulada)'})[s]||'Disponible'}
function home(){let ts=all().filter(t=>t.country===data.country&&(filter==='all'||t.mode===filter));return `<div class="hero"><h2>¿Necesitas una mano?</h2><div class="muted">Publica un favor con precio fijo y encuentra ayuda cercana.</div><button class="btn" style="margin-top:13px" data-page="create">＋ Publicar un favor</button></div>${countrySwitch()}<h2 class="section-title">Favores disponibles</h2><div class="switch"><button class="btn ${filter==='all'?'':'secondary'}" data-filter="all">Todos</button><button class="btn ${filter==='now'?'':'secondary'}" data-filter="now">⚡ Ahora</button><button class="btn ${filter==='scheduled'?'':'secondary'}" data-filter="scheduled">Programados</button></div>${ts.map(taskCard).join('')||'<div class="empty">No hay tareas para mostrar.</div>'}`}
function create(){return `<h2 class="section-title">Publicar un favor</h2><div class="notice">No ingreses tu dirección exacta, teléfono, contraseñas ni información bancaria en esta demostración.</div><form id="createForm"><div class="field"><label>¿Qué necesitas?</label><input name="title" maxlength="80" required placeholder="Ej. Ayudar a mover una mesa"></div><div class="field"><label>Descripción</label><textarea name="description" maxlength="500" required placeholder="Explica la tarea sin compartir información privada"></textarea></div><div class="field"><label>Categoría</label><select name="category"><option>Compras</option><option>Entregas</option><option>Hogar</option><option>Mascotas</option><option>Patio y limpieza</option><option>Otros favores permitidos</option></select></div><div class="field"><label>Modalidad</label><select name="mode" id="mode"><option value="now">⚡ Porfa Ahora</option><option value="scheduled">▦ Porfa Programado</option></select></div><div class="field hide" id="dateBox"><label>Fecha y hora</label><input name="date" type="datetime-local"></div><div class="field"><label>País</label><select name="country"><option value="US" ${data.country==='US'?'selected':''}>Estados Unidos</option><option value="VE" ${data.country==='VE'?'selected':''}>Venezuela</option></select></div><div class="field"><label>Ciudad (sin dirección)</label><input name="city" maxlength="60" required placeholder="Ej. Nashville o Carora"></div><div class="field"><label>Precio fijo ofrecido (USD, demostración)</label><input name="price" type="number" min="1" max="10000" step="0.01" value="20" required></div><button class="btn full" type="submit">Publicar tarea de prueba</button></form>`}
function jobs(){return `<h2 class="section-title">Mis tareas</h2>${data.jobs.length?data.jobs.map(taskCard).join(''):'<div class="empty">Aún no has publicado tareas.<br><br><button class="btn" data-page="create">Publicar mi primera tarea</button></div>'}`}
function profile(){return `<h2 class="section-title">Perfil de prueba</h2><div class="card"><h3>👤 ${esc(data.name)}</h3><p class="muted">Esta demostración no crea una cuenta real.</p><div class="field"><label>Nombre de pantalla</label><input id="displayName" maxlength="40" value="${esc(data.name)}"></div><button class="btn secondary" id="saveName">Guardar nombre</button></div><div class="card"><h3>Seguridad en Porfa</h3><p class="small">En el producto real se necesitarán verificación de identidad, controles de tareas, soporte, prevención de fraudes y pagos autorizados antes de contratar.</p><button class="btn outline" id="clearDemo">Borrar mis datos de prueba</button></div>`}
function detail(){let t=task(activeId);if(!t)return home();let mine=data.jobs.some(j=>j.id===t.id);let worker=t.country==='US'?{name:'Alex (perfil ficticio)',distance:'2.4 millas',rating:'4.8',jobs:31}:{name:'María (perfil ficticio)',distance:'3.1 km',rating:'4.9',jobs:24};return `<button class="btn secondary" data-back="1">← Volver</button><h2 class="section-title">${esc(t.title)}</h2><div class="card"><div class="row between"><span class="pill">${esc(t.category)}</span><span class="price">$${Number(t.price).toFixed(2)}</span></div><p>${esc(t.description)}</p><p class="muted small">📍 ${esc(t.city)} · ${t.mode==='now'?'Porfa Ahora':'Porfa Programado'}${t.date?' · '+esc(t.date.replace('T',' ')):''}</p><span class="badge">${statusLabel(t.status)}</span></div><div class="notice">Las coincidencias y las identidades son ficticias. Ninguna persona ha recibido una oferta real.</div>${t.status==='available'?`<button class="btn full" data-match="${esc(t.id)}">Simular búsqueda de trabajador</button>`:`<div class="card"><h3>Asignación de prueba</h3><div class="worker"><strong>${worker.name}</strong><br><span class="small muted">⭐ ${worker.rating} · ${worker.jobs} tareas · ${worker.distance}</span><p class="small">Identidad: no verificada (perfil simulado)</p></div><div class="progress"><span style="width:${t.status==='completed'?'100':t.status==='assigned'?'70':'35'}%"></span></div><p class="small muted">${statusLabel(t.status)}</p>${t.status==='offered'?`<button class="btn full" data-progress="assigned">Simular aceptación de oferta</button>`:''}${t.status==='assigned'?`<button class="btn full" data-progress="completed">Simular tarea completada</button>`:''}</div>`}${mine?`<button class="btn outline full" data-remove="${esc(t.id)}" style="margin-top:12px">Eliminar tarea de prueba</button>`:''}`}
function render(){let v=$('#view');v.innerHTML=activeId?detail():({home,create,jobs,profile}[page]||home)();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const mode=$('#mode');if(mode){mode.addEventListener('change',()=>$('#dateBox').classList.toggle('hide',mode.value!=='scheduled'))}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){setPage(b.dataset.page)}else if(b.dataset.country){data.country=b.dataset.country;save();render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.open){activeId=b.dataset.open;render()}else if(b.dataset.back){activeId=null;render()}else if(b.dataset.match){let t=data.jobs.find(x=>x.id===b.dataset.match);if(!t){let seed=seeds.find(x=>x.id===b.dataset.match);t={...seed};data.jobs.unshift(t)}t.status='offered';save();render()}else if(b.dataset.progress){let t=data.jobs.find(x=>x.id===activeId);if(t){t.status=b.dataset.progress;save();render()}}else if(b.dataset.remove){if(confirm('¿Eliminar esta tarea de prueba?')){data.jobs=data.jobs.filter(x=>x.id!==b.dataset.remove);save();activeId=null;page='jobs';render()}}else if(b.id==='saveName'){data.name=$('#displayName').value.trim()||'Invitado';save();render()}else if(b.id==='clearDemo'){if(confirm('¿Borrar todas las tareas y datos de prueba?')){data={country:'US',jobs:[],name:'Invitado'};save();setPage('home')}}});
document.addEventListener('submit',e=>{if(e.target.id!=='createForm')return;e.preventDefault();let f=new FormData(e.target);let price=Number(f.get('price'));if(!Number.isFinite(price)||price<1)return alert('Introduce un precio válido.');if(f.get('mode')==='scheduled'&&!f.get('date'))return alert('Selecciona fecha y hora.');let t={id:'p'+Date.now(),title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),category:f.get('category'),mode:f.get('mode'),country:f.get('country'),city:String(f.get('city')).trim(),price,status:'available',date:f.get('date')||''};if(!t.title||!t.description||!t.city)return;data.jobs.unshift(t);data.country=t.country;save();page='jobs';activeId=t.id;render()});render();
</script></body></html>
